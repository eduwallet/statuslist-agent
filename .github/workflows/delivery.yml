# Delivery: builds, scans and pushes ghcr.io/privacybydesign/statuslist-agent.
# Push to main -> :edge, release vX.Y.Z -> :X.Y.Z and :latest, manual run ->
# :<branch>. PR builds are scanned in Status checks; published images are
# re-scanned weekly by image-rescan.yml.
name: Delivery

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      # The old Delivery tagged :latest on every version build (metadata-action's
      # latest=auto with type=semver/type=match); keep doing so on releases.
      tag-latest: true
