# Weekly re-scan of the PUBLISHED images (all platforms) for new CVEs.
name: Image rescan

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  rescan:
    uses: privacybydesign/github-workflows/.github/workflows/image-rescan.yml@v1
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      # openid4vc-poc-ops (dev and prod) pins 1.3.0, which was published without
      # a GitHub release (same digest as :latest today).
      tags: edge latest-release 1.3.0
      severity-cutoff: high
